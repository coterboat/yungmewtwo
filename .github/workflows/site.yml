# One workflow for the whole site, because commits pushed with GITHUB_TOKEN don't trigger other workflows.
#   pulse  (schedule / manual): pull data, commit it to main
#   deploy (push, or pulse changed something): build the app + site data, publish to GitHub Pages
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: '25 20 * * *' # prices: TCGCSV refreshes about 20:05 UTC
    - cron: '25 22 * * *' # prices again, in case TCGCSV ran late
    - cron: '7,37 * * * *' # news, deals and alerts
  workflow_dispatch:
    inputs:
      force:
        description: Re-pull every price group even if TCGCSV hasn't changed
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  pulse:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prices (TCGCSV)
        if: github.event.schedule != '7,37 * * * *'
        run: node scripts/pull-tcgcsv.ts ${{ inputs.force && '--force' || '' }}
      - name: Commit data
        id: commit
        run: |
          git config user.name "yungmewtwo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "data: pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: pulse
    if: always() && (github.event_name == 'push' || needs.pulse.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
