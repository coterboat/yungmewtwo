# One workflow for the whole site, because commits pushed with GITHUB_TOKEN don't trigger other workflows.
#   pulse  (schedule / manual / push): pull data, send phone alerts, commit to main
#   deploy (push, or pulse changed something): build the app + site data, publish to GitHub Pages
#
# What each trigger does inside pulse:
#   25 20 and 25 22 daily   prices (TCGCSV), then news, then alerts
#   7,37 every hour         news, then alerts
#   manual run              all three
#   push to main            only when data/user/** changed (a new post, a watch, an edit): alerts
#                           only, no pulls, so the other person's phone buzzes within a minute or two
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: '25 20 * * *' # prices: TCGCSV refreshes about 20:05 UTC
    - cron: '25 22 * * *' # prices again, in case TCGCSV ran late
    - cron: '7,37 * * * *' # news, deals and alerts
  workflow_dispatch:
    inputs:
      force:
        description: Re-pull every price group even if TCGCSV hasn't changed
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A push can carry several commits; the diff below needs the one before them.
          fetch-depth: ${{ github.event_name == 'push' && 50 || 1 }}
      - name: What to do on this trigger
        id: scope
        run: |
          mode=full
          if [ "${{ github.event_name }}" = "push" ]; then
            mode=skip
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- data/user 2>/dev/null | grep -q . \
              || ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
              mode=alerts
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode != 'skip'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        # The alerts-only path (a new post) skips this: the scripts need no packages, and a minute matters.
        if: steps.scope.outputs.mode == 'full'
      - name: Prices (TCGCSV)
        if: steps.scope.outputs.mode == 'full' && github.event.schedule != '7,37 * * * *'
        run: node scripts/pull-tcgcsv.ts ${{ inputs.force && '--force' || '' }}
      - name: News (PokéBeach, Reddit)
        if: steps.scope.outputs.mode == 'full'
        # A blocked or broken feed is recorded in data/news.json and shown in the app; it never stops prices from committing.
        continue-on-error: true
        run: node scripts/pull-news.ts
      - name: Phone alerts (ntfy)
        if: steps.scope.outputs.mode != 'skip'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/alerts.ts
      - name: Commit data
        id: commit
        run: |
          git config user.name "yungmewtwo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "data: pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: pulse
    if: always() && (github.event_name == 'push' || needs.pulse.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
